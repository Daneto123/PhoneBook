<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Телефонен указател</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📒</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1><span aria-hidden="true">📒</span> Телефонен указател</h1>
    <input id="search" type="search" placeholder="Търси по име, номер или имейл…" autocomplete="off" aria-label="Търсене">
    <button id="newBtn" class="btn primary" type="button">＋ Нов контакт</button>
  </header>

  <main class="layout">
    <section class="list-pane" aria-label="Контакти">
      <nav class="tabs" role="tablist">
        <button type="button" role="tab" data-filter="all" class="active">Всички <span id="countAll" class="count"></span></button>
        <button type="button" role="tab" data-filter="fav">★ Любими <span id="countFav" class="count"></span></button>
      </nav>
      <ul id="list" class="contact-list"></ul>
      <p id="empty" class="empty" hidden></p>
    </section>

    <section id="detail" class="detail-pane" aria-live="polite">
      <div class="placeholder">
        <div class="placeholder-icon" aria-hidden="true">👤</div>
        <p>Изберете контакт от списъка</p>
      </div>
    </section>
  </main>

  <dialog id="formDialog" class="form-dialog">
    <form id="contactForm" method="dialog" novalidate>
      <header class="dialog-head">
        <h2 id="formTitle">Нов контакт</h2>
        <button type="button" class="icon-btn" data-close aria-label="Затвори">✕</button>
      </header>

      <div class="avatar-edit">
        <div id="avatarPreview" class="avatar xl"></div>
        <div class="avatar-actions">
          <label class="btn">Избери снимка<input id="avatarInput" type="file" accept="image/*" hidden></label>
          <button id="avatarRemove" type="button" class="btn ghost">Махни снимката</button>
          <small class="error" data-error="avatar"></small>
        </div>
      </div>

      <div class="grid2">
        <label>Име *<input name="firstName" autocomplete="given-name" required><small class="error" data-error="firstName"></small></label>
        <label>Фамилия<input name="lastName" autocomplete="family-name"><small class="error" data-error="lastName"></small></label>
      </div>
      <label>Имейл<input name="email" type="email" autocomplete="email"><small class="error" data-error="email"></small></label>
      <label>Адрес<input name="address" autocomplete="street-address"><small class="error" data-error="address"></small></label>

      <fieldset>
        <legend>Телефони *</legend>
        <div id="phoneRows"></div>
        <small class="error" data-error="phones"></small>
        <button id="addPhoneRow" type="button" class="btn ghost small">＋ Още номер</button>
      </fieldset>

      <p class="error form-error" data-error="_form"></p>
      <footer class="dialog-foot">
        <button type="button" class="btn ghost" data-close>Отказ</button>
        <button type="submit" class="btn primary" id="saveBtn">Запази</button>
      </footer>
    </form>
  </dialog>

  <template id="phoneRowTemplate">
    <div class="phone-row">
      <select name="phoneType" aria-label="Вид">
        <option>мобилен</option>
        <option>домашен</option>
        <option>служебен</option>
        <option>друг</option>
      </select>
      <input name="phoneNumber" type="tel" placeholder="0888 123 456" aria-label="Номер" autocomplete="tel">
      <button type="button" class="icon-btn" data-remove-row aria-label="Премахни номера">✕</button>
      <small class="error"></small>
    </div>
  </template>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
